<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>Pocket Ledger</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{
  --bg:#121212; 
  --panel:#1e1e1e; 
  --panel2:#2a2a2a; 
  --line:#404040;
  --txt:#ffffff; 
  --muted:#999999;
  --in:#ffffff; 
  --out:#888888;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;touch-action:manipulation;}
body{
  background:var(--bg); color:var(--txt);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:18px 14px calc(70px + env(safe-area-inset-bottom));
  padding-top:calc(18px + env(safe-area-inset-top));
  max-width:560px; margin:0 auto;
  -webkit-text-size-adjust:100%;
}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
button, input, select { touch-action: manipulation; }

.top{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.big{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.card{background:var(--panel2);border-radius:10px;padding:10px 4px;text-align:center;overflow:hidden}
.card .lbl{font-size:10px}
.card .val{font-size:13px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.neg{color:var(--muted)!important; text-decoration: line-through;}

.daybar{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.daybar .nav{width:36px;height:42px;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:11px;font-size:20px;line-height:1;cursor:pointer}
.daybar .nav:active{background:var(--panel2)}
#day{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:10px 6px;font:inherit;font-size:14px;font-weight:600;outline:none;-webkit-appearance:none;appearance:none;text-align:center;}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:99px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.filters button.active{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.custom-range{display:none;gap:8px;margin-bottom:10px}
.custom-range.show{display:flex}
.custom-range input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px;font:inherit;font-size:14px;outline:none;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}

.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pill{width:56px;flex:none;text-align:center;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 0;border-radius:6px}
.pill.in{background:var(--txt);color:var(--bg)}
.pill.out{border:1px solid var(--txt);color:var(--txt)}
.track{flex:1;height:11px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:0}
.fill{height:100%;width:0;border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.fill.in{background:var(--txt)}
.fill.out{background:var(--out)}
.num{width:78px;flex:none;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.netrow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:12px;padding-top:11px;font-size:14px;color:var(--muted);font-weight:600}
.netrow strong{font-size:17px;font-variant-numeric:tabular-nums;color:var(--txt)}

.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:9px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.seg button.active{background:var(--panel);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.45)}
#typeSeg button.active[data-type="in"]{background:var(--txt);color:var(--bg);box-shadow:none}
#typeSeg button.active[data-type="out"]{background:var(--muted);color:var(--bg);box-shadow:none}
#typeSeg button.active[data-type="transfer"]{background:var(--panel);border:1px solid var(--txt);color:var(--txt);box-shadow:none}

select.method-select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;font-weight:600;outline:none;margin-bottom:10px;-webkit-appearance:none;appearance:none;}
.amountrow{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:10px}
.amountrow .cur{color:var(--muted);font-size:20px;font-weight:700}
.amountrow input{flex:1;min-width:0;border:0;background:transparent;color:var(--txt);font:inherit;font-size:27px;font-weight:700;padding:11px 8px;outline:none;font-variant-numeric:tabular-nums}
.amountrow input::placeholder{color:#555}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
#note{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;outline:none;margin-bottom:10px}
.primary{width:100%;border:1px solid var(--txt);border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
.primary[data-current="in"]{background:var(--txt);color:var(--bg)}
.primary[data-current="out"]{background:transparent;color:var(--txt)}
.primary[data-current="transfer"]{background:var(--panel2);color:var(--txt)}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:9px}

.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 10px}
.listhead h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em}
.tx{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.in{background:var(--txt)}
.dot.out{border:2px solid var(--txt); background:transparent;}
.dot.transfer{background:var(--muted)}
.txmain{flex:1;min-width:0}
.txnote{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txmeta{font-size:12px;color:var(--muted);margin-top:1px}
.txamt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.txamt.in{color:var(--txt)}
.txamt.out{color:var(--muted)}
.txamt.transfer{color:var(--txt); font-weight:600}
.del{width:30px;height:30px;flex:none;border:0;border-radius:50%;background:transparent;color:#5c6675;font-size:19px;line-height:1;cursor:pointer;padding:0}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px}

.footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.footer button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.footer button:active{background:var(--panel2)}
.footer input#cur{width:46px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;text-align:center;outline:none}

.sync-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:20px;}
.sync-panel input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px;margin-bottom:8px;font:inherit;font-size:14px;outline:none}
.sync-panel button{width:100%;background:var(--txt);color:var(--bg);border:0;border-radius:8px;padding:10px;font:inherit;font-weight:700;margin-bottom:6px;cursor:pointer}
.sync-panel button#btnPull{background:var(--panel2);color:var(--txt);border:1px solid var(--line);}
</style>
</head>
<body>

<div class="top">
  <div class="lbl">Total in pocket</div>
  <div class="big" id="total">$0.00</div>
  <div class="cards">
    <div class="card"><div class="lbl">Account</div><div class="val" id="b-account">$0.00</div></div>
    <div class="card"><div class="lbl">Savings</div><div class="val" id="b-savings">$0.00</div></div>
    <div class="card"><div class="lbl">Cash</div><div class="val" id="b-cash">$0.00</div></div>
    <div class="card"><div class="lbl">Coins</div><div class="val" id="b-coins">$0.00</div></div>
  </div>
</div>

<div class="daybar">
  <button class="nav" id="prev" aria-label="Previous day">‹</button>
  <input type="date" id="day">
  <button class="nav" id="next" aria-label="Next day">›</button>
</div>

<div class="filters" id="filterSeg">
  <button data-scope="day" class="active">Day</button>
  <button data-scope="week">Week</button>
  <button data-scope="month">Month</button>
  <button data-scope="year">Year</button>
  <button data-scope="custom">Custom</button>
  <button data-scope="all">All Time</button>
</div>

<div class="custom-range" id="customRange">
  <input type="date" id="startDate">
  <input type="date" id="endDate">
</div>

<div class="panel">
  <div class="row">
    <span class="pill in">In (+)</span>
    <div class="track"><div class="fill in" id="fillIn"></div></div>
    <span class="num" id="numIn">$0.00</span>
  </div>
  <div class="row">
    <span class="pill out">Out (-)</span>
    <div class="track"><div class="fill out" id="fillOut"></div></div>
    <span class="num" id="numOut">$0.00</span>
  </div>
  <div class="netrow"><span>Net for period</span><strong id="net">$0.00</strong></div>
</div>

<div class="panel">
  <div class="seg" id="typeSeg">
    <button data-type="in" class="active">Money In (+)</button>
    <button data-type="out">Money Out (-)</button>
    <button data-type="transfer">Transfer</button>
  </div>
  
  <div id="standardMethod">
    <select id="methodSelect" class="method-select">
      <option value="account">Account</option>
      <option value="savings">Savings</option>
      <option value="cash">Cash</option>
      <option value="coins">Coins</option>
    </select>
  </div>

  <div id="transferMethod" style="display:none;">
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <select id="fromSelect" class="method-select" style="margin:0;">
        <option value="account">From: Account</option>
        <option value="savings">From: Savings</option>
        <option value="cash">From: Cash</option>
        <option value="coins">From: Coins</option>
      </select>
      <select id="toSelect" class="method-select" style="margin:0;">
        <option value="account">To: Account</option>
        <option value="savings">To: Savings</option>
        <option value="cash">To: Cash</option>
        <option value="coins">To: Coins</option>
      </select>
    </div>
  </div>

  <div class="amountrow">
    <span class="cur" id="curSym">$</span>
    <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
  </div>
  <input id="note" type="text" placeholder="Note (lunch, salary, transfer…)" maxlength="60">
  <button id="addBtn" class="primary" data-current="in">Add Money In (+)</button>
  <div class="hint" id="addHint"></div>
</div>

<div class="listhead">
  <h2>History</h2>
</div>
<div id="list"></div>

<div class="sync-panel">
  <div class="lbl" style="margin-bottom:8px;">Cloud Sync (GitHub Gist)</div>
  <input type="password" id="ghToken" placeholder="GitHub Token (with 'gist' scope)">
  <input type="text" id="ghGistId" placeholder="Gist ID (from the URL)">
  <div style="display:flex;gap:8px;">
    <button id="btnPush">Upload to Cloud</button>
    <button id="btnPull">Load from Cloud</button>
  </div>
  <div class="hint" id="syncHint">Sync between laptop and phone.</div>
</div>

<div class="footer">
  <label>Currency <input id="cur" type="text" maxlength="4" value="$"></label>
  <button id="exportBtnCsv">Export Excel/CSV</button>
  <button id="exportBtn">Export JSON</button>
  <button id="importBtn">Import JSON</button>
  <input type="file" id="fileInput" accept="application/json,.json" hidden>
</div>

<script>
(function(){
  'use strict';

  var KEY = 'pocketledger.v1';
  var state = { txs: [], cur: '$' };

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var d = JSON.parse(raw);
        if(d && Array.isArray(d.txs)){
          state.txs = d.txs;
          state.cur = d.cur || '$';
        }
      }
    }catch(e){}
    var tok = localStorage.getItem('ledger_token');
    var gid = localStorage.getItem('ledger_gist');
    if(tok) document.getElementById('ghToken').value = tok;
    if(gid) document.getElementById('ghGistId').value = gid;
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ alert('Could not save.'); }
  }
  load();

  function toDateStr(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function todayStr(){ return toDateStr(new Date()); }
  function fmt(cents){
    var neg = cents < 0;
    var v = Math.abs(cents) / 100;
    return (neg ? '-' : '') + state.cur + v.toFixed(2);
  }
  function parseAmt(v){
    var n = parseFloat(String(v).replace(',', '.'));
    if(!isFinite(n) || n <= 0) return null;
    return Math.round(n * 100);
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  var $ = function(id){ return document.getElementById(id); };
  var totalEl=$('total'), bAcc=$('b-account'), bSav=$('b-savings'), bCash=$('b-cash'), bCoins=$('b-coins');
  var dayEl=$('day'), filterSeg=$('filterSeg'), customRange=$('customRange'), startDateEl=$('startDate'), endDateEl=$('endDate');
  var fillIn=$('fillIn'), fillOut=$('fillOut'), numIn=$('numIn'), numOut=$('numOut'), netEl=$('net');
  var amountEl=$('amount'), noteEl=$('note'), addBtn=$('addBtn'), addHint=$('addHint'), listEl=$('list');
  var curInput=$('cur'), curSym=$('curSym');
  var typeSeg=$('typeSeg'), methodSelect=$('methodSelect'), fromSelect=$('fromSelect'), toSelect=$('toSelect');
  var standardMethod=$('standardMethod'), transferMethod=$('transferMethod');
  var syncHint=$('syncHint');

  var curType='in', scope='day';
  dayEl.value = todayStr();
  startDateEl.value = todayStr();
  endDateEl.value = todayStr();

  function getFilteredTxs() {
    if (scope === 'all') return state.txs.slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    
    if (scope === 'custom') { 
      var s = new Date(startDateEl.value + 'T00:00:00');
      var e = new Date(endDateEl.value + 'T23:59:59');
      if (isNaN(s) || isNaN(e)) return state.txs;
      return state.txs.filter(function(t){
        var d = new Date(t.date + 'T12:00:00');
        return d >= s && d <= e;
      }).sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    }

    var parts = dayEl.value.split('-');
    var now = new Date(parts[0], parts[1]-1, parts[2]);
    var start = new Date(now);
    var end = new Date(now);

    if (scope === 'day') { 
      start = new Date(now); end = new Date(now); 
    } else if (scope === 'week') { 
      start.setDate(now.getDate() - now.getDay()); 
      end.setDate(start.getDate() + 6); 
    } else if (scope === 'month') { 
      start.setDate(1); 
      end.setMonth(now.getMonth()+1, 0); 
    } else if (scope === 'year') { 
      start.setMonth(0,1); 
      end.setMonth(11,31); 
    }
    
    var sStr = toDateStr(start), eStr = toDateStr(end);
    return state.txs.filter(function(t){ 
      return t.date >= sStr && t.date <= eStr; 
    }).sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
  }

  function balances(){
    var b = { account:0, savings:0, cash:0, coins:0 };
    for(var i=0;i<state.txs.length;i++){
      var t = state.txs[i];
      if(t.type === 'transfer'){
        if(t.method in b) b[t.method] -= t.cents;
        if(t.toMethod in b) b[t.toMethod] += t.cents;
      } else if(t.method in b){
        b[t.method] += (t.type === 'in' ? 1 : -1) * t.cents;
      }
    }
    return b;
  }

  function render(){
    var b = balances();
    var total = b.account + b.savings + b.cash + b.coins;
    totalEl.textContent = fmt(total);
    totalEl.classList.toggle('neg', total < 0);

    [[bAcc,b.account],[bSav,b.savings],[bCash,b.cash],[bCoins,b.coins]].forEach(function(pair){
      pair[0].textContent = fmt(pair[1]);
      pair[0].classList.toggle('neg', pair[1] < 0);
    });

    var filtered = getFilteredTxs();
    var sIn=0, sOut=0;
    for(var i=0;i<filtered.length;i++){
      var t = filtered[i];
      if(t.type === 'in') sIn += t.cents; 
      else if(t.type === 'out') sOut += t.cents;
    }

    var max = Math.max(sIn, sOut, 1);
    fillIn.style.width = (sIn/max*100)+'%';
    fillOut.style.width = (sOut/max*100)+'%';
    numIn.textContent = fmt(sIn);
    numOut.textContent = fmt(sOut);

    var net = sIn - sOut;
    netEl.textContent = (net > 0 ? '+' : '') + fmt(net);
    netEl.classList.toggle('neg', net < 0);

    curSym.textContent = state.cur;
    
    if(curType === 'in'){ 
      addBtn.textContent = 'ADD MONEY IN (+)'; 
      addBtn.setAttribute('data-current', 'in');
      addHint.textContent = 'Adds to selected account'; 
    }
    else if(curType === 'out'){ 
      addBtn.textContent = 'TAKE MONEY OUT (-)'; 
      addBtn.setAttribute('data-current', 'out');
      addHint.textContent = 'Subtracts from selected account'; 
    }
    else { 
      addBtn.textContent = 'TRANSFER FUNDS'; 
      addBtn.setAttribute('data-current', 'transfer');
      addHint.textContent = 'Moves money between accounts'; 
    }

    standardMethod.style.display = curType === 'transfer' ? 'none' : 'block';
    transferMethod.style.display = curType === 'transfer' ? 'block' : 'none';

    renderList(filtered);
  }

  function renderList(items){
    if(!items.length){
      listEl.innerHTML = '<div class="empty">No transactions for this period.</div>';
      return;
    }

    var html = '';
    for(var i=0;i<items.length;i++){
      var t = items[i];
      var isIn = t.type === 'in', isOut = t.type === 'out';
      var cls = isIn ? 'in' : (isOut ? 'out' : 'transfer');
      var sign = isIn ? '+' : (isOut ? '−' : '⇄');
      
      var meta = '';
      var safeMethod = t.method || 'account'; 
      if(t.type === 'transfer'){
        var safeTo = t.toMethod || 'savings';
        meta = 'Transfer: ' + safeMethod.charAt(0).toUpperCase() + safeMethod.slice(1) + ' → ' + safeTo.charAt(0).toUpperCase() + safeTo.slice(1);
      } else {
        meta = safeMethod.charAt(0).toUpperCase() + safeMethod.slice(1);
      }

      html += '<div class="tx">' +
        '<span class="dot ' + cls + '"></span>' +
        '<div class="txmain">' +
          '<div class="txnote">' + esc(t.note || (isIn?'Money In':(isOut?'Money Out':'Transfer'))) + '</div>' +
          '<div class="txmeta">' + meta + ' · ' + t.date + '</div>' +
        '</div>' +
        '<span class="txamt ' + cls + '">' + sign + fmt(t.cents) + '</span>' +
        '<button class="del" data-id="' + t.id + '">×</button>' +
      '</div>';
    }
    listEl.innerHTML = html;
  }

  typeSeg.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-type]');
    if(!btn) return;
    curType = btn.dataset.type;
    Array.prototype.forEach.call(typeSeg.children, function(b){ b.classList.toggle('active', b === btn); });
    render();
  });

  filterSeg.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-scope]');
    if(!btn) return;
    scope = btn.dataset.scope;
    Array.prototype.forEach.call(filterSeg.children, function(b){ b.classList.toggle('active', b === btn); });
    customRange.classList.toggle('show', scope === 'custom');
    render();
  });

  startDateEl.addEventListener('change', render);
  endDateEl.addEventListener('change', render);

  addBtn.addEventListener('click', function(){
    var cents = parseAmt(amountEl.value);
    if(cents === null) { amountEl.focus(); return; }
    
    // Safety check for removing more money than an account has
    if(curType === 'out'){
      var b = balances();
      if(b[methodSelect.value] < cents){
        if(!confirm("Warning: This will make your " + methodSelect.value + " balance negative.\n\nAre you sure?")) {
          return;
        }
      }
    }
    if(curType === 'transfer'){
      var b2 = balances();
      if(fromSelect.value === toSelect.value) { alert("Cannot transfer to the same location."); return; }
      if(b2[fromSelect.value] < cents){
        if(!confirm("Warning: You don't have enough in " + fromSelect.value + " to transfer this amount. It will go negative.\n\nAre you sure?")) {
          return;
        }
      }
    }
    
    var newTx = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      type: curType,
      cents: cents,
      note: noteEl.value.trim(),
      date: dayEl.value || todayStr(),
      ts: Date.now()
    };

    if(curType === 'transfer'){
      newTx.method = fromSelect.value;
      newTx.toMethod = toSelect.value;
    } else {
      newTx.method = methodSelect.value;
    }

    state.txs.push(newTx);
    save();
    amountEl.value = '';
    noteEl.value = '';
    render();
    amountEl.focus();
  });

  listEl.addEventListener('click', function(e){
    var btn = e.target.closest('.del');
    if(!btn) return;
    var id = btn.dataset.id;
    if(confirm('Delete this transaction?')){
      state.txs = state.txs.filter(function(t){ return t.id !== id; });
      save();
      render();
    }
  });

  dayEl.addEventListener('change', function(){ if(!dayEl.value) dayEl.value = todayStr(); render(); });
  function shiftDay(n){
    var p = dayEl.value.split('-').map(Number);
    var dt = new Date(p[0], p[1]-1, p[2] + n);
    dayEl.value = toDateStr(dt); render();
  }
  $('prev').addEventListener('click', function(){ shiftDay(-1); });
  $('next').addEventListener('click', function(){ shiftDay(1); });
  curInput.addEventListener('change', function(){ state.cur = curInput.value.trim() || '$'; curInput.value = state.cur; save(); render(); });

  $('exportBtnCsv').addEventListener('click', function(){
    var filtered = getFilteredTxs();
    if(!filtered.length){ alert("No data in current view to export."); return; }
    
    var csv = "\uFEFFDate,Type,From/Account,To/Account,Amount,Note\n";
    filtered.forEach(function(t){
      var amt = (t.cents/100).toFixed(2);
      var from = t.method || 'account';
      var to = t.toMethod || '';
      var note = '"' + (t.note||'').replace(/"/g, '""') + '"';
      csv += `${t.date},${t.type},${from},${to},${amt},${note}\n`;
    });

    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'ledger-export.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });

  $('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'ledger-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });
  $('importBtn').addEventListener('click', function(){ $('fileInput').click(); });
  $('fileInput').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var data = JSON.parse(r.result);
        if(!data || !Array.isArray(data.txs)) throw new Error('bad');
        if(confirm('Replace ALL current data with this backup?')) {
          state.txs = data.txs; state.cur = data.cur || '$';
          curInput.value = state.cur; save(); render();
        }
      }catch(err){ alert('Invalid backup file.'); }
    };
    r.readAsText(f); e.target.value = '';
  });

  function getSyncCreds(){
    var tok = $('ghToken').value.trim();
    var gid = $('ghGistId').value.trim();
    if(!tok || !gid){ alert('Enter both Token and Gist ID.'); return null; }
    localStorage.setItem('ledger_token', tok);
    localStorage.setItem('ledger_gist', gid);
    return { tok, gid };
  }

  $('btnPush').addEventListener('click', function(){
    var creds = getSyncCreds(); if(!creds) return;
    syncHint.textContent = "Uploading...";
    
    var payload = { files: { "ledger.json": { content: JSON.stringify(state, null, 2) } } };
    
    fetch(`https://api.github.com/gists/${creds.gid}`, {
      method: 'PATCH',
      headers: { 'Authorization': `token ${creds.tok}`, 'Accept': 'application/vnd.github.v3+json' },
      body: JSON.stringify(payload)
    }).then(function(r){ 
      if(!r.ok) throw new Error('Auth failed'); 
      syncHint.textContent = "Uploaded successfully! ✅"; 
    }).catch(function(){ syncHint.textContent = "Upload failed. Check token/gist. ❌"; });
  });

  $('btnPull').addEventListener('click', function(){
    var creds = getSyncCreds(); if(!creds) return;
    syncHint.textContent = "Loading...";
    
    fetch(`https://api.github.com/gists/${creds.gid}`, {
      headers: { 'Authorization': `token ${creds.tok}`, 'Accept': 'application/vnd.github.v3+json' }
    }).then(function(r){ return r.json(); }).then(function(data){
      if(data.files && data.files['ledger.json']){
        var remoteState = JSON.parse(data.files['ledger.json'].content);
        if(remoteState.txs && confirm("Overwrite local data with cloud data?")){
          state = remoteState;
          curInput.value = state.cur || '$';
          save(); render();
          syncHint.textContent = "Loaded successfully! ✅";
        } else {
          syncHint.textContent = "Cancelled or empty cloud.";
        }
      } else {
        syncHint.textContent = "Could not find ledger.json in Gist.";
      }
    }).catch(function(){ syncHint.textContent = "Load failed. Check token/gist. ❌"; });
  });

  curInput.value = state.cur;
  render();
})();
</script>
</body>
</html>
